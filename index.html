<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Inter',sans-serif; background:#0B0D0F; color:#F4F5F6; display:flex; min-height:100vh; }
.sidebar { width:260px; background:#14171A; border-right:1px solid #25292D; padding:24px 16px; display:flex; flex-direction:column; height:100vh; position:sticky; top:0; overflow-y:auto; flex-shrink:0; }
.logo-area { display:flex; align-items:center; gap:14px; margin-bottom:32px; padding-bottom:20px; border-bottom:1px solid #25292D; }
.logo-symbol { width:44px; height:44px; flex-shrink:0; }
.logo-symbol svg { width:100%; height:100%; }
.logo-text { font-weight:800; font-size:20px; letter-spacing:-0.5px; color:#fff; }
.logo-text span { color:#F5B51B; }
.logo-sub { font-size:9px; color:#888B93; text-transform:uppercase; letter-spacing:0.2em; }
.nav-group { margin-bottom:20px; }
.nav-group-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; color:#888B93; padding-left:12px; margin-bottom:6px; }
.nav-item { display:flex; align-items:center; gap:14px; padding:10px 14px; border-radius:10px; color:#888B93; font-size:14px; font-weight:500; transition:0.2s; cursor:pointer; }
.nav-item svg { width:18px; height:18px; fill:none; stroke:#888B93; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:0.2s; }
.nav-item:hover { background:#25292D; color:#fff; }
.nav-item.active { background:#25292D; color:#F5B51B; }
.nav-item.active svg { stroke:#F5B51B; }
.user-section { margin-top:auto; padding-top:16px; border-top:1px solid #25292D; display:flex; align-items:center; gap:12px; }
.user-avatar { width:38px; height:38px; border-radius:50%; background:#F5B51B; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:#0B0D0F; }
.user-name { font-size:14px; font-weight:600; }
.user-role { font-size:11px; color:#888B93; }
.main { flex:1; padding:28px 36px; overflow-y:auto; max-height:100vh; min-width:0; }
.main-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:12px; }
.main-header h1 { font-size:26px; font-weight:700; letter-spacing:-0.5px; }
.main-header h1 span { color:#F5B51B; }
.header-actions { display:flex; gap:10px; flex-wrap:wrap; }
.btn { padding:10px 22px; border:none; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer; transition:0.2s; display:inline-flex; align-items:center; gap:8px; justify-content:center; }
.btn-primary { background:#F5B51B; color:#0B0D0F; }
.btn-primary:hover { background:#e0a810; }
.btn-secondary { background:#14171A; color:#F4F5F6; border:1px solid #25292D; }
.btn-secondary:hover { background:#25292D; }
.btn-success { background:#4ADE80; color:#0B0D0F; }
.btn-danger { background:#F87171; color:#fff; }
.btn-warning { background:#FBBF24; color:#0B0D0F; }
.btn-sm { padding:6px 16px; font-size:12px; border-radius:6px; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px; }
.stat-card { background:#14171A; border:1px solid #25292D; border-radius:16px; padding:18px 22px; }
.stat-card .label { font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:#888B93; font-weight:600; }
.stat-card .value { font-size:30px; font-weight:800; margin-top:2px; }
.card { background:#14171A; border:1px solid #25292D; border-radius:16px; padding:20px 24px; margin-bottom:20px; }
.intel-section { background:#14171A; border:1px solid #F5B51B; border-radius:16px; padding:24px 28px; margin-bottom:28px; position:relative; }
.intel-section .badge { position:absolute; top:-10px; left:20px; background:#F5B51B; color:#0B0D0F; padding:2px 14px; border-radius:20px; font-size:10px; font-weight:700; text-transform:uppercase; }
.intel-section h3 { font-size:18px; font-weight:700; margin-bottom:6px; }
.intel-section .sub { color:#888B93; font-size:14px; margin-bottom:18px; }
.intel-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
.intel-card { background:#0B0D0F; border:1px solid #25292D; border-radius:10px; padding:16px 18px; }
.intel-card .route { font-weight:600; font-size:14px; }
.intel-card .route small { display:block; font-weight:400; color:#888B93; font-size:12px; }
.intel-card .match { display:inline-block; background:#4ADE80; color:#0B0D0F; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:700; margin:6px 0; }
.intel-card .detail { font-size:12px; color:#888B93; margin:4px 0; }
.intel-card .price { font-weight:700; color:#F5B51B; font-size:18px; }
.page-content { display:none; width:100%; }
.page-content.active { display:block; }
.loading { text-align:center; color:#888B93; padding:20px; }
.loading .spinner { display:inline-block; width:24px; height:24px; border:3px solid #25292D; border-top-color:#F5B51B; border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.form-group { display:grid; gap:6px; margin-bottom:10px; }
.form-group.full { grid-column:1/-1; }
.form-group label { font-size:11px; color:#888B93; font-weight:600; text-transform:uppercase; }
.input { width:100%; padding:10px; background:#0B0D0F; border:1px solid #25292D; border-radius:6px; color:#fff; font-size:14px; }
.input:focus { border-color:#F5B51B; outline:none; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:1000; padding:20px; }
.modal-overlay.open { display:flex; }
.modal { background:#14171A; border:1px solid #25292D; border-radius:16px; padding:32px; max-width:700px; width:100%; max-height:90vh; overflow-y:auto; }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.modal-header h2 { font-size:20px; color:#fff; }
.modal-actions { display:flex; gap:12px; margin-top:20px; }
.modal-actions .btn { flex:1; }
.close { background:transparent; border:none; color:#888B93; font-size:24px; cursor:pointer; }
.routes-container { display:grid; grid-template-columns:1fr; gap:20px; }
.route-card { background:#14171A; border:1px solid #25292D; border-radius:16px; padding:20px 24px; border-left:4px solid #F5B51B; }
.route-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
.route-title { font-size:18px; font-weight:700; margin-bottom:4px; }
.route-subtitle { font-size:13px; color:#888B93; }
.route-status-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:600; }
.status-pending { background:#f59e0b22; color:#FBBF24; }
.status-accepted { background:#3b82f622; color:#60A5FA; }
.status-in_transit { background:#F5B51B22; color:#F5B51B; }
.status-delivered { background:#4ADE8022; color:#4ADE80; }
.status-delivered_by_carrier { background:#22c55e22; color:#22c55e; }
.status-cancelled { background:#F8717122; color:#F87171; }
.route-info-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }
.route-info-item { background:#0B0D0F; padding:12px 14px; border-radius:8px; }
.route-info-item .lbl { font-size:11px; color:#888B93; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:4px; }
.route-info-item .val { font-size:15px; font-weight:600; color:#fff; }

.rating-badge { display:inline-block; background:#F5B51B22; color:#F5B51B; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; margin-left:6px; }
.cost-breakdown { background:#0B0D0F; border-radius:8px; padding:14px; margin-top:12px; }
.cost-row { display:flex; justify-content:space-between; padding:4px 0; font-size:13px; }

.cost-row.fuel { color:#FBBF24; }

.cost-row.fee { color:#60A5FA; }

.route-actions { display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
.route-actions .btn { flex:1; min-width:120px; }
.empty-state { text-align:center; color:#888B93; padding:60px 20px; }
.empty-state h3 { font-size:18px; margin-bottom:8px; color:#fff; }
.status-pill { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
.surge-badge { display:inline-block; background:#F8717122; color:#F87171; padding:2px 10px; border-radius:12px; font-size:11px; font-weight:700; margin-left:6px; animation:pulse 2s infinite; }

@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
.price-preview { background:#0B0D0F; border:1px solid #F5B51B; border-radius:10px; padding:16px; margin-top:14px; }

.factor-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; margin-right:4px; }
.factor-up { background:#F8717122; color:#F87171; }
.factor-down { background:#4ADE8022; color:#4ADE80; }
.diesel-widget { background:#14171A; border:1px solid #FBBF2433; border-radius:10px; padding:10px 14px; display:flex; align-items:center; gap:10px; font-size:12px; color:#888B93; }
.diesel-widget .val { color:#FBBF24; font-weight:800; font-size:16px; }
.toast { position:fixed; bottom:24px; right:24px; background:#14171A; border:1px solid #F5B51B; border-radius:10px; padding:16px 24px; max-width:360px; z-index:9999; box-shadow:0 8px 32px rgba(0,0,0,0.6); }
@media (max-width:768px) { .sidebar { display:none; } .main { padding:16px; } .stats { grid-template-columns:1fr 1fr; } .form-grid { grid-template-columns:1fr; } .route-info-grid { grid-template-columns:1fr; } .intel-grid { grid-template-columns:1fr; } }
</style>
</head>

<script>
let token = localStorage.getItem('cargothink_token');
let currentUser = JSON.parse(localStorage.getItem('cargothink_user') || 'null');
let currentMatchId = null;
let currentOtherUserId = null;
let currentRatingMatchId = null;
let pollInterval = null;
let pricePreviewTimer = null;
let lastPricePreview = null;

function updateUserInfo() {
    if (currentUser && currentUser.full_name) {
        document.getElementById('userName').textContent = currentUser.full_name;
        document.getElementById('userRole').textContent = currentUser.role === 'shipper' ? 'Грузоотправитель' : 'Перевозчик';
        document.getElementById('userAvatar').textContent = currentUser.full_name.charAt(0).toUpperCase();
    } else {
        document.getElementById('userName').textContent = 'Гость';
        document.getElementById('userRole').textContent = 'Не авторизован';
        document.getElementById('userAvatar').textContent = 'Г';
    }
}

function parsePrice(str) {
    if (typeof str === 'number') return str;
    var cleaned = String(str).replace(/[\s.,]/g, '');
    return parseInt(cleaned) || 0;
}

function formatDate(dateStr) {
    if (!dateStr) return '—';
    try { return new Date(dateStr).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }); }
    catch (e) { return dateStr; }
}

function formatPrice(num) {
    if (num === null || num === undefined) return '—';
    return Math.round(parseFloat(num)).toLocaleString('ru-RU') + ' ₽';
}

async function apiCall(endpoint, method, body) {
    method = method || 'GET';
    var headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    var options = { method: method, headers: headers };
    if (body) options.body = JSON.stringify(body);
    var response = await fetch('/api' + endpoint, options);
    var data = await response.json();
    if (!response.ok) {
        if (response.status === 401) {
            localStorage.removeItem('cargothink_token');
            localStorage.removeItem('cargothink_user');
            token = null; currentUser = null;
            showAuthRequired();
            throw new Error('Сессия истекла');
        }
        throw new Error(data.error || 'Ошибка');
    }
    return data;
}

function showToast(title, message, isError) {
    var existing = document.querySelector('.toast');
    if (existing) existing.remove();
    var toast = document.createElement('div');
    toast.className = 'toast';
    var borderColor = isError ? '#F87171' : '#F5B51B';
    toast.style.borderColor = borderColor;
    toast.innerHTML = '<strong style="color:' + borderColor + ';">' + title + '</strong><p style="color:#888B93;font-size:14px;margin-top:4px;">' + message + '</p>';
    document.body.appendChild(toast);
    setTimeout(function() { if (toast.parentNode) toast.remove(); }, 4000);
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function showLogin() { openModal('loginModal'); }
function showRegister() { openModal('registerModal'); }

async function handleLogin() {
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    if (!email || !password) { showToast('Ошибка', 'Заполните поля', true); return; }
    try {
        var data = await apiCall('/auth/login', 'POST', { email: email, password: password });
        token = data.token; currentUser = data.user;
        localStorage.setItem('cargothink_token', token);
        localStorage.setItem('cargothink_user', JSON.stringify(currentUser));
        closeModal('loginModal');
        showToast('Добро пожаловать', 'Привет, ' + currentUser.full_name);
        updateUserInfo(); showDashboardUI(); navigateTo('overview');
    } catch (err) { showToast('Ошибка входа', err.message, true); }
}

async function handleRegister() {
    var full_name = document.getElementById('regName').value.trim();
    var email = document.getElementById('regEmail').value.trim();
    var password = document.getElementById('regPassword').value;
    var role = document.getElementById('regRole').value;
    var company_name = document.getElementById('regCompany').value.trim();
    if (!full_name || !email || !password) { showToast('Ошибка', 'Заполните поля', true); return; }
    if (password.length < 6) { showToast('Ошибка', 'Пароль мин. 6 символов', true); return; }
    try {
        var data = await apiCall('/auth/register', 'POST', { email: email, password: password, full_name: full_name, company_name: company_name, role: role });
        token = data.token; currentUser = data.user;
        localStorage.setItem('cargothink_token', token);
        localStorage.setItem('cargothink_user', JSON.stringify(currentUser));
        closeModal('registerModal');
        showToast('Успех', 'Добро пожаловать!');
        updateUserInfo(); showDashboardUI(); navigateTo('overview');
    } catch (err) { showToast('Ошибка', err.message, true); }
}

function logout() {
    localStorage.removeItem('cargothink_token');
    localStorage.removeItem('cargothink_user');
    token = null; currentUser = null;
    showAuthRequired(); updateUserInfo();
}

function showAuthRequired() {
    document.getElementById('authRequired').style.display = 'flex';
    document.getElementById('dashboardContent').style.display = 'none';
    updateUserInfo();
}

function showDashboardUI() {
    document.getElementById('authRequired').style.display = 'none';
    document.getElementById('dashboardContent').style.display = 'block';
    updateUserInfo();
}

function navigateTo(page) {
    stopMessagePolling();
    document.querySelectorAll('.page-content').forEach(function(el) { el.classList.remove('active'); });
    var target = document.getElementById('page-' + page);
    if (target) target.classList.add('active');
    document.querySelectorAll('.sidebar .nav-item').forEach(function(item) {
        item.classList.remove('active');
        if (item.dataset.page === page) item.classList.add('active');
    });
    if (page === 'overview') loadOverview();
    else if (page === 'cargo') loadCargoPage();
    else if (page === 'transport') loadTransportPage();
    else if (page === 'routes') loadRoutes();
    else if (page === 'shared') loadSharedPage();
    else if (page === 'messages') loadMessages();
    else if (page === 'settings') loadSettings();
}

document.addEventListener('click', function(e) {
    const item = e.target.closest('.sidebar .nav-item');
    if (item && item.dataset.page) { e.preventDefault(); navigateTo(item.dataset.page); }
});

function updatePricePreview() {
    if (pricePreviewTimer) clearTimeout(pricePreviewTimer);
    pricePreviewTimer = setTimeout(async function() {
        var origin = document.getElementById('cargoOrigin').value.trim();
        var dest = document.getElementById('cargoDest').value.trim();
        var weight = parseInt(document.getElementById('cargoWeight').value) || 0;
        var type = document.getElementById('cargoType').value;
        var pickup = document.getElementById('cargoPickup').value;
        var container = document.getElementById('pricePreviewContainer');
        if (!container) return;
        if (!origin || !dest || !weight) { container.innerHTML = ''; return; }
        
        try {
            var data = await apiCall('/price/dynamic', 'POST', { origin_city: origin, dest_city: dest, weight_kg: weight, cargo_type: type, pickup_date: pickup || null });
            lastPricePreview = data;
            var surgeBadge = data.surge_label ? '<span class="surge-badge' + (data.total_factor < 0.9 ? ' low' : '') + '">' + data.surge_label + ' ×' + data.total_factor + '</span>' : '';
            var html = '<div class="price-preview">';
            html += '<div class="total">' + formatPrice(data.total_price) + surgeBadge + '</div>';
            html += '<div class="row"><span>Базовая цена</span><span>' + formatPrice(data.base_price) + '</span></div>';
            html += '<div class="row"><span>Расстояние</span><span>' + data.distance_km + ' км</span></div>';
            html += '<div class="row"><span>Надбавки</span><span>';
            if (data.demand_factor !== 1) html += '<span class="factor-badge ' + (data.demand_factor > 1 ? 'factor-up' : 'factor-down') + '">Спрос ×' + data.demand_factor + '</span>';
            if (data.fuel_factor !== 1) html += '<span class="factor-badge ' + (data.fuel_factor > 1 ? 'factor-up' : 'factor-down') + '">Бензин ×' + data.fuel_factor + '</span>';
            if (data.time_factor !== 1) html += '<span class="factor-badge ' + (data.time_factor > 1 ? 'factor-up' : 'factor-down') + '">Время ×' + data.time_factor + '</span>';
            if (data.season_factor !== 1) html += '<span class="factor-badge ' + (data.season_factor > 1 ? 'factor-up' : 'factor-down') + '">Сезон ×' + data.season_factor + '</span>';
            if (data.urgency_factor !== 1) html += '<span class="factor-badge ' + (data.urgency_factor > 1 ? 'factor-up' : 'factor-down') + '">Срочность ×' + data.urgency_factor + '</span>';
            html += '</span></div>';
            html += '<div class="row"><span>⛽ Дизель сегодня</span><span>' + data.diesel_current + ' ₽/л</span></div>';
            html += '<div class="row"><span>📊 Заказов / Свободных ТС</span><span>' + data.open_cargos + ' / ' + data.available_trucks + '</span></div>';
            html += '<div style="text-align:center;margin-top:10px;"><button class="btn btn-secondary btn-sm" onclick="useDynamicPrice()">Использовать эту цену</button></div>';
            html += '</div>';
            container.innerHTML = html;
        } catch (e) {
            console.log('Price preview failed:', e.message);
        }
    }, 500);
}

function useDynamicPrice() {
    if (!lastPricePreview) return;
    document.getElementById('cargoPrice').value = lastPricePreview.total_price;
    showToast('Успех', 'Цена установлена: ' + formatPrice(lastPricePreview.total_price));
}

async function loadDashboardData() {
    try {
        var stats = await apiCall('/stats');
        document.getElementById('statActive').textContent = stats.pending_matches || 0;
        document.getElementById('statCargo').textContent = stats.open_cargo || 0;
        document.getElementById('statTransport').textContent = stats.available_transport || 0;
        document.getElementById('statCompletion').textContent = stats.completed_shipments || 0;

            document.getElementById('dieselValue').textContent = stats.diesel_price + ' ₽';
        }
    } catch (err) { console.error(err); }

async function loadMatches() {
    try {
        var matches = await apiCall('/matches');
        var grid = document.getElementById('intelGrid');
        var title = document.getElementById('intelTitle');
        if (!grid) return;
        var pending = matches.filter(function(m) { return m.status === 'pending'; });
        if (pending.length === 0) {
            if (title) title.textContent = 'Нет доступных совпадений';
            grid.innerHTML = '<div style="text-align:center;color:#888B93;padding:20px;">Пока ничего нет.</div>';
            return;
        }
        if (title) title.textContent = pending.length + ' совпадений найдено';
        var html = '';
        for (var i = 0; i < Math.min(pending.length, 6); i++) {
            var m = pending[i];
            var surge = (m.surge_multiplier && parseFloat(m.surge_multiplier) > 1.15) ? '<span class="surge-badge">🔥 ×' + parseFloat(m.surge_multiplier).toFixed(2) + '</span>' : '';
            html += '<div class="intel-card">';
            html += '<div class="route">' + (m.origin_city || '—') + ' → ' + (m.dest_city || '—') + '<small>' + (m.weight_kg || 0) + ' т · ' + (m.cargo_type || '—') + '</small></div>';
            html += '<span class="match">' + Math.round(m.match_score || 0) + '%</span>' + surge;
            html += '<div class="detail">👤 ' + (m.shipper_name || '—') + ' ⭐ ' + (m.shipper_rating ? parseFloat(m.shipper_rating).toFixed(1) : '0.0') + '</div>';
            html += '<div class="detail">🚛 ' + (m.carrier_name || '—') + ' ⭐ ' + (m.carrier_rating ? parseFloat(m.carrier_rating).toFixed(1) : '0.0') + '</div>';
            html += '<div class="price">' + formatPrice(m.cargo_price) + '</div>';
            html += '<button class="btn btn-primary btn-sm" style="margin-top:10px; width:100%;" onclick="acceptMatch(\'' + m.id + '\')">Принять</button>';
            html += '</div>';
        }
        grid.innerHTML = html;
    } catch (err) { console.error(err); }
}

async function acceptMatch(matchId) {
    try { await apiCall('/matches/' + matchId + '/accept', 'POST'); showToast('Успех', 'Рейс принят!'); navigateTo('routes'); }
    catch (err) { showToast('Ошибка', err.message, true); }
}

    loadCargoList();
}

async function loadCargoList() {
    try {
        var endpoint = currentUser.role === 'shipper' ? '/cargo/my' : '/cargo';
        var cargo = await apiCall(endpoint);
        var container = document.getElementById('cargoList');
        if (cargo.length === 0) { container.innerHTML = '<div class="empty-state"><h3>Нет грузов</h3><p>Создайте первый груз</p></div>'; return; }
        var html = '';
        for (var i = 0; i < cargo.length; i++) {
            var c = cargo[i];
            var statusText = 'Открыт';
            var statusColor = '#4ADE80';
            if (c.active_matches > 0) { statusText = 'Перевозчик найден'; statusColor = '#60A5FA'; }
            else if (c.shipping_matches > 0) { statusText = 'В пути'; statusColor = '#F5B51B'; }
            else if (c.completed_matches > 0) { statusText = 'Доставлено'; statusColor = '#22c55e'; }
            else if (c.pending_matches > 0) { statusText = 'Ищем перевозчика (' + c.pending_matches + ')'; statusColor = '#FBBF24'; }
            
            var surge = (c.surge_multiplier && parseFloat(c.surge_multiplier) > 1.15) ? '<span class="surge-badge">🔥 Спрос ×' + parseFloat(c.surge_multiplier).toFixed(2) + '</span>' : '';
            
            html += '<div class="card">';
            html += '<div style="display:flex; justify-content:space-between; align-items:start; flex-wrap:wrap; gap:10px;">';
            html += '<div><div style="font-size:18px; font-weight:700; margin-bottom:6px;">' + c.origin_city + ' → ' + c.dest_city + surge + '</div>';
            if (c.origin_address) html += '<div style="font-size:13px; color:#888B93;">📍 ' + c.origin_address + '</div>';
            if (c.dest_address) html += '<div style="font-size:13px; color:#888B93;">🎯 ' + c.dest_address + '</div>';
            html += '<div style="margin-top:10px; font-size:13px; color:#888B93;">📦 ' + c.weight_kg + ' т · ' + c.cargo_type + ' · 📅 ' + formatDate(c.pickup_date) + '</div>';
            html += '<div style="margin-top:8px;"><span class="status-pill" style="background:' + statusColor + '22;color:' + statusColor + ';">' + statusText + '</span></div>';
            html += '</div>';
            html += '<div style="text-align:right;"><div style="font-size:22px; font-weight:800; color:#F5B51B;">' + formatPrice(c.price) + '</div>';
            if (c.base_price && parseFloat(c.base_price) !== parseFloat(c.price)) {
                html += '<div style="font-size:11px; color:#888B93; text-decoration:line-through;">' + formatPrice(c.base_price) + '</div>';
            }
            html += '</div></div>';
            
            if (currentUser.role === 'shipper') {
                html += '<div class="route-actions" style="margin-top:14px;">';
                if (c.status === 'open') {
                    html += '<button class="btn btn-danger btn-sm" onclick="deleteCargo(\'' + c.id + '\')">🗑️ Удалить</button>';
                    html += '<button class="btn btn-secondary btn-sm" onclick="createSharedLoad(\'' + c.id + '\')">👥 В совместную</button>';
                }
                if (c.pending_matches > 0 && c.active_matches === 0) {
                    html += '<button class="btn btn-secondary btn-sm" onclick="navigateTo(\'routes\')">👀 Совпадения</button>';
                    html += '<button class="btn btn-warning btn-sm" onclick="declineAllMatches(\'' + c.id + '\')">❌ Отклонить все</button>';
                }
                if (c.active_matches > 0) {
                    html += '<button class="btn btn-primary btn-sm" onclick="navigateTo(\'routes\')">📦 Открыть рейс</button>';
                    html += '<button class="btn btn-warning btn-sm" onclick="cancelActiveMatch(\'' + c.id + '\')">↩️ Отменить и вернуть деньги</button>';
                }
                if (c.shipping_matches > 0) {
                    html += '<button class="btn btn-primary btn-sm" onclick="navigateTo(\'routes\')">📦 Открыть рейс</button>';
                }
                html += '</div>';
            }
            html += '</div>';
        }
        container.innerHTML = html;
    } catch (err) { console.error(err); }
}

async function deleteCargo(cargoId) {
    if (!confirm('Удалить этот груз?')) return;
    try { await apiCall('/cargo/' + cargoId, 'DELETE'); showToast('Успех', 'Груз удалён'); loadCargoList(); }
    catch (err) { showToast('Ошибка', err.message, true); }
}

async function declineAllMatches(cargoId) {
    if (!confirm('Отклонить все совпадения?')) return;
    try {
        var matches = await apiCall('/matches');
        var toDecline = matches.filter(function(m) { return m.cargo_id === cargoId && m.status === 'pending'; });
        for (var i = 0; i < toDecline.length; i++) {
            await apiCall('/matches/' + toDecline[i].id + '/decline', 'POST');
        }
        showToast('Успех', 'Отклонено ' + toDecline.length);
        loadCargoList();
    } catch (err) { showToast('Ошибка', err.message, true); }
}

async function cancelActiveMatch(cargoId) {
    if (!confirm('Отменить активный рейс? Если оплачено — вернём деньги из Escrow.')) return;
    try {
        var matches = await apiCall('/matches');
        var active = matches.filter(function(m) { return m.cargo_id === cargoId && (m.status === 'accepted' || m.status === 'pending'); });
        if (active.length === 0) { showToast('Ошибка', 'Нет активного рейса', true); return; }
        for (var i = 0; i < active.length; i++) {
            if (active[i].escrow_status_check === 'held') {
                await apiCall('/matches/' + active[i].id + '/refund', 'POST');
            } else {
                await apiCall('/matches/' + active[i].id + '/cancel', 'POST');
            }
        }
        showToast('Успех', 'Рейс отменён, деньги возвращены');
        loadCargoList();
    } catch (err) { showToast('Ошибка', err.message, true); }
}

async function createSharedLoad(cargoId) {
    if (!confirm('Добавить груз в совместную перевозку?')) return;
    try {
        await apiCall('/shared-loads', 'POST', { cargo_id: cargoId });
        showToast('Успех', 'Груз добавлен в совместную');
        navigateTo('shared');
    } catch (err) { showToast('Ошибка', err.message, true); }
}

function openCargoModal() {
    openModal('cargoModal');
    document.getElementById('pricePreviewContainer').innerHTML = '';
    lastPricePreview = null;
}

async function submitCargo() {
    var origin = document.getElementById('cargoOrigin').value.trim();
    var dest = document.getElementById('cargoDest').value.trim();
    var originAddress = document.getElementById('cargoOriginAddress').value.trim();
    var destAddress = document.getElementById('cargoDestAddress').value.trim();
    var weight = parseInt(document.getElementById('cargoWeight').value);
    var type = document.getElementById('cargoType').value;
    var pickup = document.getElementById('cargoPickup').value;
    var rawPrice = document.getElementById('cargoPrice').value;
    var price = parsePrice(rawPrice);
    var desc = document.getElementById('cargoDesc').value.trim();
    
    if (!origin || !dest || !weight || !pickup || !price) { showToast('Ошибка', 'Заполните поля', true); return; }
    if (price < 100) { showToast('Ошибка', 'Цена мин. 100 ₽', true); return; }
    
    var body = {
        origin_city: origin, dest_city: dest,
        origin_address: originAddress || null, dest_address: destAddress || null,
        weight_kg: weight, cargo_type: type,
        pickup_date: pickup, delivery_date: null,
        price: price, description: desc || null
    };
    
    if (lastPricePreview && lastPricePreview.total_price === price) {
        body.base_price = lastPricePreview.base_price;
        body.surge_multiplier = lastPricePreview.total_factor;
        body.price_factors = {
            demand: lastPricePreview.demand_factor,
            fuel: lastPricePreview.fuel_factor,
            time: lastPricePreview.time_factor,
            season: lastPricePreview.season_factor,
            urgency: lastPricePreview.urgency_factor,
            popularity: lastPricePreview.popularity_factor
        };
    }
    
    try {
        await apiCall('/cargo', 'POST', body);
        closeModal('cargoModal');
        showToast('Успех', 'Груз опубликован! ' + formatPrice(price));
        navigateTo('cargo');
    } catch (err) { showToast('Ошибка', err.message, true); }
}

async function loadSharedList() {

            html += '<div class="route-title">' + s.origin_city + ' → ' + s.dest_city + '</div>';
            html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;">';
            html += '<div class="route-info-item"><div class="lbl">Вес</div><div class="val">' + s.total_weight_kg + ' т</div></div>';
            html += '<div class="route-info-item"><div class="lbl">Стоимость</div><div class="val price">' + formatPrice(s.combined_price) + '</div></div>';
            html += '<div class="route-info-item"><div class="lbl">Экономия</div><div class="val" style="color:#4ADE80;">' + (s.savings_percent || 0) + '%</div></div>';
            html += '<div class="route-info-item"><div class="lbl">Создатель</div><div class="val">' + (s.primary_shipper_name || '—') + '</div></div>';
            html += '</div></div>';
        }
        container.innerHTML = html;
    } catch (err) { console.error(err); }
}

// ROUTES
// ═══════════════════════════════════════════════════════
function loadRoutes() {
    document.getElementById('page-routes').innerHTML = '<div class="main-header"><h1><span>Маршруты</span></h1></div><div class="routes-container" id="routesContainer"><div class="loading"><div class="spinner"></div></div></div>';
    loadRoutesData();
}

async function loadRoutesData() {
    try {
        var matches = await apiCall('/matches');
        var container = document.getElementById('routesContainer');
        var active = matches.filter(function(m) { return ['pending', 'accepted', 'in_transit', 'delivered_by_carrier', 'delivered'].indexOf(m.status) !== -1; });
        if (active.length === 0) { container.innerHTML = '<div class="empty-state"><h3>Нет активных маршрутов</h3></div>'; return; }
        var html = '';
        for (var i = 0; i < active.length; i++) {
            var m = active[i];
            var surge = (m.surge_multiplier && parseFloat(m.surge_multiplier) > 1.15) ? '<span class="surge-badge">🔥 ×' + parseFloat(m.surge_multiplier).toFixed(2) + '</span>' : '';
            html += '<div class="route-card">';
            html += '<div class="route-header"><div>';
            html += '<div class="route-title">' + (m.origin_city || '—') + ' → ' + (m.dest_city || '—') + surge + '</div>';
            if (m.origin_address) html += '<div class="route-subtitle">📍 ' + m.origin_address + '</div>';
            if (m.dest_address) html += '<div class="route-subtitle">🎯 ' + m.dest_address + '</div>';
            html += '</div>';
            var statusText = { 'pending': 'Ожидает', 'accepted': 'Принят', 'in_transit': 'В пути', 'delivered_by_carrier': 'Доставлено', 'delivered': 'Завершён' };
            html += '<span class="route-status-badge status-' + m.status + '">' + (statusText[m.status] || m.status) + '</span>';
            html += '</div>';
            
            html += '<div class="route-info-grid">';
            html += '<div class="route-info-item"><div class="lbl">Груз</div><div class="val">' + (m.weight_kg || 0) + ' т · ' + (m.cargo_type || '—') + '</div></div>';
            html += '<div class="route-info-item"><div class="lbl">Цена</div><div class="val price">' + formatPrice(m.cargo_price) + '</div></div>';
            html += '<div class="route-info-item"><div class="lbl">Грузоотправитель</div><div class="val">' + (m.shipper_name || '—') + ' <span class="rating-badge">⭐ ' + (m.shipper_rating ? parseFloat(m.shipper_rating).toFixed(1) : '0.0') + '</span></div></div>';
            html += '<div class="route-info-item"><div class="lbl">Перевозчик</div><div class="val">' + (m.carrier_name || '—') + ' <span class="rating-badge">⭐ ' + (m.carrier_rating ? parseFloat(m.carrier_rating).toFixed(1) : '0.0') + '</span></div></div>';
            html += '</div>';
            
            if (m.escrow_status_check) {
                html += '<div class="cost-breakdown">';
                var escrowStatusText = m.escrow_status_check === 'held' ? '🔒 Зарезервировано' : m.escrow_status_check === 'released' ? '✅ Выплачено' : m.escrow_status_check === 'refunded' ? '↩️ Возврат' : m.escrow_status_check === 'disputed' ? '⚠️ Спор' : m.escrow_status_check;
                html += '<div class="cost-row total"><span>💰 Оплата в Escrow <small style="color:#4ADE80;">(' + escrowStatusText + ')</small></span><span>' + formatPrice(m.escrow_amount) + '</span></div>';
                if (m.driver_pay) html += '<div class="cost-row driver"><span>💵 Перевозчику (70%)</span><span>' + formatPrice(m.driver_pay) + '</span></div>';
                if (m.fuel) html += '<div class="cost-row fuel"><span>⛽ Топливо (15%)</span><span>' + formatPrice(m.fuel) + '</span></div>';
                if (m.tolls) html += '<div class="cost-row tolls"><span>🛣️ Платные дороги (5%)</span><span>' + formatPrice(m.tolls) + '</span></div>';
                if (m.platform_fee) html += '<div class="cost-row fee"><span>🏦 Комиссия (10%)</span><span>' + formatPrice(m.platform_fee) + '</span></div>';
                html += '</div>';
            }
            
            html += '<div class="route-actions">';
            var isShipper = currentUser.id === m.shipper_id;
            var isCarrier = currentUser.id === m.carrier_id;
            
            if (m.status === 'pending') {
                if (isCarrier) html += '<button class="btn btn-primary" onclick="acceptMatch(\'' + m.id + '\')">✅ Принять</button>';
                if (isShipper) html += '<div style="flex-basis:100%;padding:12px;color:#FBBF24;font-size:13px;">⏳ Ожидание перевозчика</div>';
                html += '<button class="btn btn-danger" onclick="declineMatch(\'' + m.id + '\')">❌ Отклонить</button>';
            }
            else if (m.status === 'accepted' && isShipper && !m.escrow_status_check) {
                html += '<button class="btn btn-success" onclick="depositEscrow(\'' + m.id + '\')">💳 Оплатить (' + formatPrice(m.cargo_price) + ')</button>';
                html += '<button class="btn btn-danger" onclick="cancelMatch(\'' + m.id + '\')">✕ Отменить</button>';
            }
            else if (m.status === 'accepted' && isShipper && m.escrow_status_check === 'held') {
                html += '<div style="flex-basis:100%;padding:12px;color:#4ADE80;font-size:13px;">💰 Оплачено в Escrow — деньги вернутся если отменить</div>';
                html += '<button class="btn btn-warning" onclick="refundMatch(\'' + m.id + '\')">↩️ Вернуть деньги и отменить</button>';
            }
            else if (m.status === 'accepted' && isCarrier) {
                if (m.escrow_status_check === 'held') html += '<button class="btn btn-primary" onclick="startRoute(\'' + m.id + '\')">🚀 Начать рейс</button>';
                else html += '<div style="flex-basis:100%;padding:12px;color:#FBBF24;font-size:13px;">⏳ Ждём оплаты</div>';
                html += '<button class="btn btn-danger" onclick="cancelMatch(\'' + m.id + '\')">✕ Отменить</button>';
            }
            else if (m.status === 'in_transit' && isCarrier) {
                html += '<button class="btn btn-secondary" onclick="checkIn(\'' + m.id + '\', \'pickup\')">📍 Погрузка + Фото</button>';
                html += '<button class="btn btn-secondary" onclick="checkIn(\'' + m.id + '\', \'delivery\')">📍 Доставка + Фото</button>';
                html += '<button class="btn btn-success" onclick="confirmDelivery(\'' + m.id + '\')">✅ Доставлено</button>';
            }
            else if (m.status === 'in_transit' && isShipper) {
                html += '<div style="flex-basis:100%;padding:12px;color:#F5B51B;font-size:13px;">🚛 Груз в пути.</div>';
                html += '<button class="btn btn-secondary" onclick="showETA(\'' + m.id + '\')">⏱️ ETA</button>';
                html += '<button class="btn btn-secondary" onclick="showTracking(\'' + m.id + '\')">🗺️ GPS</button>';
                html += '<button class="btn btn-danger" onclick="openDispute(\'' + m.id + '\')">⚠️ Спор</button>';
            }
            else if (m.status === 'delivered_by_carrier' && isShipper) {
                html += '<button class="btn btn-success" onclick="confirmReceipt(\'' + m.id + '\')">✅ Подтвердить получение</button>';
                html += '<button class="btn btn-danger" onclick="openDispute(\'' + m.id + '\')">⚠️ Проблема</button>';
            }
            else if (m.status === 'delivered_by_carrier' && isCarrier) {
                html += '<div style="flex-basis:100%;padding:12px;color:#4ADE80;font-size:13px;">✅ Ожидайте подтверждения</div>';
            }
            else if (m.status === 'delivered') {
                html += '<button class="btn btn-secondary" onclick="openRatingModal(\'' + m.id + '\')">⭐ Оценить</button>';
            }
            
            html += '<button class="btn btn-secondary" onclick="openChatFromMatch(\'' + m.id + '\', \'' + (isShipper ? m.carrier_id : m.shipper_id) + '\', \'' + (isShipper ? m.carrier_name : m.shipper_name) + '\')">💬 Чат</button>';
            html += '</div></div>';
        }
        container.innerHTML = html;
    } catch (err) { console.error('Load routes error:', err); }
}

async function declineMatch(matchId) {
    try { await apiCall('/matches/' + matchId + '/decline', 'POST'); showToast('Успех', 'Отклонено'); loadRoutesData(); }
    catch (err) { showToast('Ошибка', err.message, true); }
}

async function cancelMatch(matchId) {
    if (!confirm('Отменить рейс?')) return;
    try { await apiCall('/matches/' + matchId + '/cancel', 'POST'); showToast('Успех', 'Отменено'); loadRoutesData(); }
    catch (err) { showToast('Ошибка', err.message, true); }
}

async function refundMatch(matchId) {
    if (!confirm('Вернуть деньги из Escrow и отменить рейс?')) return;
    try {
        var result = await apiCall('/matches/' + matchId + '/refund', 'POST');
        showToast('Успех', 'Возвращено ' + formatPrice(result.amount));
        loadRoutesData();
    } catch (err) { showToast('Ошибка', err.message, true); }
}

async function depositEscrow(matchId) {
    if (!confirm('Оплатить в Escrow? Деньги будут зарезервированы до подтверждения доставки.')) return;
    try {
        var result = await apiCall('/escrow/deposit', 'POST', { match_id: matchId, payment_method: 'manual' });
        showToast('Успех', 'Оплачено ' + formatPrice(result.amount));
        loadRoutesData();
    } catch (err) { showToast('Ошибка', err.message, true); }
}

async function startRoute(matchId) {
    try { await apiCall('/matches/' + matchId + '/start', 'POST'); showToast('Успех', 'Рейс начат'); loadRoutesData(); }
    catch (err) { showToast('Ошибка', err.message, true); }
}

async function checkIn(matchId, type) {
    var lat = null, lng = null;
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos) { lat = pos.coords.latitude; lng = pos.coords.longitude; });
    }
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.capture = 'environment';
    input.onchange = async function() {
        try {
            var file = input.files[0];
            var photoData = null;
            if (file) {
                photoData = await new Promise(function(resolve) {
                    var reader = new FileReader();
                    reader.onload = function(e) { resolve(e.target.result); };
                    reader.readAsDataURL(file);
                });
                try { await apiCall('/proofs/' + matchId, 'POST', { type: type, photo_base64: photoData }); }
                catch (e) { console.log('Proof upload failed:', e.message); }
            }
            await apiCall('/checkins/' + matchId, 'POST', { type: type, lat: lat, lng: lng });
            showToast('Успех', '📍 ' + (type === 'pickup' ? 'Погрузка' : 'Доставка') + (file ? ' + фото' : ''));
        } catch (err) { showToast('Ошибка', err.message, true); }
    };
    input.click();
}

async function confirmDelivery(matchId) {
    if (!confirm('Подтвердите доставку?')) return;
    try { await apiCall('/matches/' + matchId + '/delivered', 'POST'); showToast('Успех', 'Ожидайте подтверждения'); loadRoutesData(); }
    catch (err) { showToast('Ошибка', err.message, true); }
}

async function confirmReceipt(matchId) {
    if (!confirm('Подтвердить получение? Оплата уйдёт перевозчику.')) return;
    try { await apiCall('/matches/' + matchId + '/confirm', 'POST'); showToast('Успех', 'Оплата отпущена'); loadRoutesData(); }
    catch (err) { showToast('Ошибка', err.message, true); }
}

function openDispute(matchId) {
    var reason = prompt('Опишите проблему (мин. 10 символов):');
    if (!reason || reason.length < 10) { showToast('Ошибка', 'Слишком коротко', true); return; }
    apiCall('/disputes', 'POST', { match_id: matchId, reason: reason })
        .then(function() { showToast('Спор открыт', 'Деньги заморожены'); loadRoutesData(); })
        .catch(function(err) { showToast('Ошибка', err.message, true); });
}

async function showETA(matchId) {
    try {
        var eta = await apiCall('/matches/' + matchId + '/eta');
        var etaTime = new Date(eta.eta).toLocaleString('ru-RU');
        showToast('⏱️ ETA', eta.distance_km + ' км · ~' + eta.hours + ' ч · ' + etaTime);
    } catch (err) { showToast('Ошибка', err.message, true); }
}

async function showTracking(matchId) {
    try {
        var data = await apiCall('/tracking/' + matchId + '/latest');
        if (!data) { showToast('GPS', 'Перевозчик ещё не отправил координаты'); return; }
        showToast('📍 GPS', 'Широта: ' + data.lat + ' · Долгота: ' + data.lng);
    } catch (err) { showToast('Ошибка', err.message, true); }
}

function openRatingModal(matchId) {
    currentRatingMatchId = matchId;
    openModal('ratingModal');
}

async function submitRating() {
    var rating = parseInt(document.getElementById('ratingValue').value);
    var comment = document.getElementById('ratingComment').value.trim();
    try {
        await apiCall('/ratings', 'POST', { match_id: currentRatingMatchId, rating: rating, comment: comment });
        closeModal('ratingModal');
        showToast('Спасибо', 'Оценка отправлена');
        loadRoutesData();
    } catch (err) { showToast('Ошибка', err.message, true); }
}

function loadMessages() {
    document.getElementById('page-messages').innerHTML = '<div class="main-header"><h1><span>Сообщения</span></h1></div><div style="display:grid; grid-template-columns:300px 1fr; gap:20px; min-height:500px;"><div class="card" style="padding:0;"><div style="padding:16px 20px; border-bottom:1px solid #25292D; font-weight:700;">💬 Чаты</div><div id="conversationsList" style="max-height:500px; overflow-y:auto;"></div></div><div class="card" style="display:flex; flex-direction:column; padding:0;"><div id="chatHeader" style="padding:16px 20px; border-bottom:1px solid #25292D;"><div style="color:#888B93; text-align:center;">Выберите чат</div></div><div id="chatMessages" style="flex:1; overflow-y:auto; padding:16px 20px; min-height:300px;"></div><div style="padding:16px 20px; border-top:1px solid #25292D; display:flex; gap:10px;"><input type="text" id="chatInput" placeholder="Сообщение..." style="flex:1; padding:10px; background:#0B0D0F; border:1px solid #25292D; border-radius:6px; color:#fff;"><button class="btn btn-primary" onclick="sendMessage()" id="sendMessageBtn" disabled>Отправить</button></div></div></div>';
    loadConversations();
    startMessagePolling();
}

async function loadConversations() {
    try {
        var conversations = await apiCall('/messages/conversations');
        var list = document.getElementById('conversationsList');
        if (!list) return;
        if (conversations.length === 0) { list.innerHTML = '<div style="text-align:center; color:#888B93; padding:40px 20px;">Нет чатов</div>'; return; }
        var html = '';
        for (var i = 0; i < conversations.length; i++) {
            var c = conversations[i];
            var unread = c.unread_count > 0 ? ' <span style="background:#F5B51B; color:#0B0D0F; border-radius:50%; padding:2px 8px; font-size:10px; font-weight:700;">' + c.unread_count + '</span>' : '';
            html += '<div onclick="openChat(\'' + c.match_id + '\', \'' + c.other_user_id + '\', \'' + c.other_user_name + '\')" style="padding:12px 20px; cursor:pointer; border-bottom:1px solid #1a1a1a;"><div style="font-weight:600; font-size:14px;">' + c.other_user_name + unread + '</div><div style="font-size:12px; color:#888B93; margin-top:4px;">' + c.origin_city + ' → ' + c.dest_city + '</div><div style="font-size:12px; color:#666; margin-top:2px;">' + (c.last_message || '').substring(0, 40) + '</div></div>';
        }
        list.innerHTML = html;
    } catch (err) { console.error(err); }
}

function openChat(matchId, otherUserId, otherUserName) {
    currentMatchId = matchId;
    currentOtherUserId = otherUserId;
    document.getElementById('chatHeader').innerHTML = '<strong>' + otherUserName + '</strong>';
    document.getElementById('sendMessageBtn').disabled = false;
    loadMessagesForMatch(matchId);
    loadConversations();
}

async function loadMessagesForMatch(matchId) {
    try {
        var messages = await apiCall('/messages/' + matchId);
        var container = document.getElementById('chatMessages');
        if (!container) return;
        if (messages.length === 0) { container.innerHTML = '<div style="text-align:center; color:#888B93; padding:40px;">Напишите первое сообщение</div>'; return; }
        var html = '';
        for (var i = 0; i < messages.length; i++) {
            var m = messages[i];
            var isMine = m.sender_id === currentUser.id;
            var bg = isMine ? '#F5B51B' : '#1a1a1a';
            var color = isMine ? '#0B0D0F' : '#F4F5F6';
            html += '<div style="display:flex; justify-content: ' + (isMine ? 'flex-end' : 'flex-start') + '; margin-bottom:8px;"><div style="max-width:70%; background:' + bg + '; color:' + color + '; padding:10px 14px; border-radius:12px;">' + m.content + '</div></div>';
        }
        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
    } catch (err) { console.error(err); }
}

async function sendMessage() {
    var input = document.getElementById('chatInput');
    var content = input.value.trim();
    if (!content || !currentMatchId || !currentOtherUserId) return;
    try {
        await apiCall('/messages', 'POST', { match_id: currentMatchId, receiver_id: currentOtherUserId, content: content });
        input.value = '';
        loadMessagesForMatch(currentMatchId);
    } catch (err) { showToast('Ошибка', err.message, true); }
}

function openChatFromMatch(matchId, otherUserId, otherUserName) {
    navigateTo('messages');
    setTimeout(function() { openChat(matchId, otherUserId, otherUserName); }, 500);
}

function startMessagePolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(function() {
        if (currentMatchId && document.getElementById('chatMessages')) {
            loadMessagesForMatch(currentMatchId);
            loadConversations();
        }
    }, 5000);
}

function stopMessagePolling() {
    if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
}

v><div style="display:flex;justify-content:space-between;padding:4px 0;"><span>⏰ Время суток</span><span>×1.0 – ×1.25</span></div><div style="display:flex;justify-content:space-between;padding:4px 0;"><span>❄️ Сезон</span><span>×1.0 – ×1.2</span></div><div style="display:flex;justify-content:space-between;padding:4px 0;"><span>⚡ Срочность</span><span>×0.95 – ×1.3</span></div></div></div></div><div class="card"><button class="btn btn-danger" onclick="logout()">Выйти</button></div>';
